<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>MIND ATLAS — 知识宇宙</title>
  <meta name="description" content="MIND ATLAS — 沉浸式 3D 知识宇宙，探索逻辑、哲学、心理学、博弈论与人类思想精华。">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%236878c0'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- 3D Canvas -->
  <div id="canvas-container"></div>

  <!-- CSS2D Label Overlay -->
  <div id="label-container"></div>

  <!-- Subject Catalog Sidebar -->
  <nav id="catalog">
    <div class="catalog-header">
      <span class="catalog-title">知识目录</span>
      <button class="catalog-toggle" id="catalog-toggle" title="Toggle catalog"></button>
    </div>
    <div class="catalog-list" id="catalog-list"></div>
  </nav>
  <button class="catalog-tab" id="catalog-tab" title="Open index"></button>

  <!-- Loading / Intro Screen -->
  <div id="loading-screen">
    <div class="loading-title">MIND ATLAS</div>
    <div class="loading-subtitle">知识宇宙</div>
    <div class="loading-progress">
      <div class="loading-progress-bar" id="loading-bar"></div>
    </div>
    <div class="loading-hint" id="loading-hint">正在开启宇宙</div>
  </div>

  <!-- Navigation Breadcrumb -->
  <div id="breadcrumb">
    <div class="breadcrumb-inner" id="breadcrumb-text"></div>
  </div>

  <!-- Atlas Back Control -->
  <div id="atlas-control">
    <button class="atlas-back" id="back-btn">
      <span class="atlas-back-icon"></span>
      <span id="back-label">知识图谱</span>
    </button>
  </div>

  <!-- Knowledge Page -->
  <div id="knowledge-page">
    <div class="kp-book" id="kp-book">
      <button class="kp-close" id="kp-close" title="返回"></button>
      <div class="kp-spread" id="kp-spread">
        <div class="kp-side kp-left" id="kp-left"></div>
        <div class="kp-side kp-right" id="kp-right"></div>
      </div>
      <!-- 纸角翻页：右页外下角＝下一页；左页外下角＝上一页（克制、像书页自然卷起的一角） -->
      <div class="kp-corner kp-corner-next" id="kp-corner-next" role="button" tabindex="-1" aria-label="翻到下一页" title="翻页">
        <span class="kp-corner-curl"></span>
      </div>
      <div class="kp-corner kp-corner-prev" id="kp-corner-prev" role="button" tabindex="-1" aria-label="翻到上一页" title="上一页">
        <span class="kp-corner-curl"></span>
      </div>
      <!-- 隐藏测量层：以真实页宽测量内容高度，用于按高度分页 -->
      <div class="kp-measure" id="kp-measure" aria-hidden="true"></div>
    </div>
  </div>

  <!-- Interaction Hint -->
  <div id="interaction-hint">
    <div class="hint-text" id="hint-text">拖拽探索 · 滚轮缩放 · 点击书籍进入</div>
  </div>

  <!-- Transition Overlay -->
  <div id="transition-overlay"></div>

  <!-- Main Module -->
  <script type="module" src="js/main.js"></script>
</body>
</html>
