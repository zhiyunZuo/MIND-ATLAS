<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>MIND ATLAS — 心智图谱 · 知识宇宙</title>
  <meta name="description" content="MIND ATLAS — 一个沉浸式 3D 知识宇宙，探索逻辑、哲学、心理学、博弈论，以及人类思想史上最伟大的观念。">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="css/style.css">
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <!-- 3D Canvas -->
  <div id="canvas-container"></div>

  <!-- CSS2D Label Overlay -->
  <div id="label-container"></div>

  <!-- Subject Catalog Sidebar -->
  <nav id="catalog">
    <div class="catalog-header">
      <span class="catalog-title">知识目录</span>
      <button class="catalog-toggle" id="catalog-toggle" title="折叠目录"></button>
    </div>
    <div class="catalog-list" id="catalog-list"></div>
  </nav>
  <button class="catalog-tab" id="catalog-tab" title="打开目录"></button>

  <!-- Loading / Intro Screen -->
  <div id="loading-screen">
    <div class="loading-title">MIND ATLAS</div>
    <div class="loading-subtitle">心智图谱 · 知识宇宙</div>
    <div class="loading-progress">
      <div class="loading-progress-bar" id="loading-bar"></div>
    </div>
    <div class="loading-hint" id="loading-hint">正在打开宇宙</div>
  </div>

  <!-- Navigation Breadcrumb -->
  <div id="breadcrumb">
    <div class="breadcrumb-inner" id="breadcrumb-text"></div>
  </div>

  <!-- Atlas Back Control -->
  <div id="atlas-control">
    <button class="atlas-back" id="back-btn">
      <span class="atlas-back-icon"></span>
      <span id="back-label">图谱</span>
    </button>
  </div>

  <!-- Knowledge Page -->
  <div id="knowledge-page">
    <div class="kp-book" id="kp-book">
      <button class="kp-close" id="kp-close" title="返回"></button>
      <div class="kp-spine"></div>
      <div class="kp-page kp-page-left" id="kp-left">
        <div class="kp-concept-title" id="kp-title"></div>
        <div class="kp-concept-subtitle" id="kp-subtitle"></div>
        <div class="kp-summary" id="kp-summary"></div>
        <div class="kp-page-number"></div>
      </div>
      <div class="kp-page kp-page-right" id="kp-right">
        <div class="kp-sections" id="kp-sections"></div>
        <div class="kp-related" id="kp-related"></div>
        <div class="kp-page-number"></div>
      </div>
    </div>
  </div>

  <!-- Interaction Hint -->
  <div id="interaction-hint">
    <div class="hint-text" id="hint-text">拖动探索 · 滚轮缩放 · 点击书籍进入</div>
  </div>

  <!-- Transition Overlay -->
  <div id="transition-overlay"></div>

  <!-- Main Module -->
  <script type="module" src="js/main.js"></script>
</body>
</html>
